<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZA404</title>
    <link rel="icon" type="image/png" href="template/whites.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Onest', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            background-color: #050505;
        }

        body {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #050505;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            overflow: hidden;
            isolation: isolate;
        }

        /* === ФОН: чёрно-серый градиент, медленно дышащий === */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-color: #050505;
            background-image:
                radial-gradient(900px 700px at 20% 15%, rgba(255, 255, 255, 0.05), transparent 60%),
                radial-gradient(900px 800px at 80% 85%, rgba(255, 255, 255, 0.04), transparent 60%),
                linear-gradient(160deg, #030303 0%, #1a1a1a 45%, #0a0a0a 100%);
            background-size: 100% 100%, 100% 100%, 220% 220%;
            animation: breathe 18s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0%   { background-position: 0% 0%, 0% 0%, 0% 0%; }
            100% { background-position: 4% 6%, -4% -3%, 30% 30%; }
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 40%, transparent 90%);
        }

        .bg-stars {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Onest', sans-serif;
            line-height: 1;
            opacity: 0;
            animation-name: twinkle;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        @keyframes twinkle {
            0%   { opacity: 0; transform: scale(0.6) rotate(0deg); }
            50%  { opacity: 1; transform: scale(1) rotate(15deg); }
            100% { opacity: 0; transform: scale(0.6) rotate(0deg); }
        }

        /* === Контент === */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 26px; /* Отступы между всеми элементами (лого, 404, текст, кнопка) */
            max-width: 640px;
        }

        /* === СТИЛИ ЛОГОТИПА === */
        .page-logo {
            /* 🎯 ГЛАВНАЯ НАСТРОЙКА: меняйте это число, чтобы изменить размер лого на ПК */
            width: var(--logo-size, 96px);
            height: var(--logo-size, 96px);
            object-fit: contain;
            display: block;
            /* Лёгкое свечение, чтобы лого вписывалось в атмосферу сайта */
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.15)); 
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .page-logo:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.3));
        }

        .code {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(6rem, 20vw, 11rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, #7a7a7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        /* Средний "0" в "404" заменён мерцающей звёздочкой */
        .code .star-zero {
            display: inline-block;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.85);
            animation: twinkle 3.2s ease-in-out infinite;
        }

        .title {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(1.5rem, 3.6vw, 2.2rem);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #f2f2f2;
        }

        .subtitle {
            font-size: 1.12rem;
            color: #9a9a9a;
            line-height: 1.65;
            max-width: 490px;
        }

        .home-link {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 17px 34px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            text-decoration: none;
            font-family: 'Unbounded', sans-serif;
            font-size: 1.02rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: border-color 0.3s ease, background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        }

        .home-link:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .home-link .arrow {
            transition: transform 0.3s ease;
        }

        .home-link:hover .arrow {
            transform: translateX(4px);
        }

        /* === АДАПТИВНОСТЬ ДЛЯ МОБИЛЬНЫХ === */
        @media (max-width: 480px) {
            .page-logo {
                /* 🎯 РАЗМЕР ЛОГО НА ТЕЛЕФОНЕ (чуть меньше, чтобы гармонично смотреться) */
                width: var(--logo-size-mobile, 72px);
                height: var(--logo-size-mobile, 72px);
            }

            .title { font-size: 1.35rem; }
            .subtitle { font-size: 1rem; }
            .home-link { padding: 15px 28px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-grid"></div>
    <div class="bg-stars" id="bgStars"></div>

    <div class="content">
        <!-- ЛОГОТИП СВЕРХУ -->
        <!-- Замените src на путь к вашему логотипу -->
        <img src="template/whites.png" alt="Логотип" class="page-logo">
        
        <div class="code">4<span class="star-zero">*</span>4</div>
        <div class="title">Страница потерялась</div>
        <p class="subtitle">Такой страницы здесь нет — возможно, она была удалена, переименована, или адрес введён с ошибкой.</p>
        <a href="index.html" class="home-link">
            <span>На главную</span>
            <span class="arrow">→</span>
        </a>
    </div>

    <script>
        (function generateStars() {
            const container = document.getElementById('bgStars');
            const count = window.innerWidth < 768 ? 35 : 70;

            for (let i = 0; i < count; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                star.textContent = '*';

                const size = 10 + Math.random() * 22;
                const duration = 3 + Math.random() * 5;
                const delay = Math.random() * 8;

                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.fontSize = size + 'px';
                star.style.animationDuration = duration + 's';
                star.style.animationDelay = delay + 's';
                star.style.opacity = '0';

                container.appendChild(star);
            }
        })();
    </script>

</body>
</html>
