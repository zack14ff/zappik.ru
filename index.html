<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Универсальные карточки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Базовые настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            background-color: #0a0d12;
        }

        body {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #0a0d12;
            color: #ffffff;
            padding: 60px 20px 80px;
            overflow-x: hidden;
            isolation: isolate;
        }

        /* === ФОН: чёрно-серый градиент, медленно дышащий === */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-color: #050505;
            background-image:
                radial-gradient(900px 700px at 20% 15%, rgba(255, 255, 255, 0.05), transparent 60%),
                radial-gradient(900px 800px at 80% 85%, rgba(255, 255, 255, 0.04), transparent 60%),
                linear-gradient(160deg, #030303 0%, #1a1a1a 45%, #0a0a0a 100%);
            background-size: 100% 100%, 100% 100%, 220% 220%;
            animation: breathe 18s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0%   { background-position: 0% 0%, 0% 0%, 0% 0%; }
            100% { background-position: 4% 6%, -4% -3%, 30% 30%; }
        }

        /* Тонкая сетка поверх, придаёт "интерфейсную" глубину */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 40%, transparent 90%);
        }

        /* Звёздочки "*", появляющиеся и мерцающие на фоне */
        .bg-stars {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1;
            opacity: 0;
            animation-name: twinkle;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        @keyframes twinkle {
            0%   { opacity: 0; transform: scale(0.6) rotate(0deg); }
            50%  { opacity: 1; transform: scale(1) rotate(15deg); }
            100% { opacity: 0; transform: scale(0.6) rotate(0deg); }
        }

        h1 {
            margin-bottom: 50px;
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Заголовок-разделитель между секциями карточек */
        .section-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin: 70px auto 40px;
        }

        .section-divider:first-of-type {
            margin-top: 0;
        }

        .section-divider::before,
        .section-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        }

        .section-divider span {
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #f2f2f2;
            white-space: nowrap;
            text-align: center;
        }

        /* Контейнер для кнопок-карточек: grid делит карточки ровно и предсказуемо */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 300px));
            gap: 30px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Стиль каждой карточки-кнопки */
        .nav-card {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
            --card-color: #00ff88;
        }

        /* Универсальный контейнер для медиа (видео или картинка) */
        .media-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(100%) brightness(0.6);
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        /* Затемняющий градиент поверх для читаемости текста */
        .nav-card .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 25px;
            transition: background 0.4s ease;
            z-index: 2;
            pointer-events: none;
        }

        .nav-card h2 {
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
            transform: translateY(10px);
            transition: transform 0.4s ease, color 0.4s ease;
        }

        .nav-card p {
            font-size: 0.9rem;
            color: #ccc;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
        }

        /* === ЭФФЕКТЫ ПРИ НАВЕДЕНИИ (только для устройств с мышью) === */
        @media (hover: hover) and (pointer: fine) {
            .nav-card:hover {
                transform: translateY(-10px);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--card-color);
            }

            .nav-card:hover .media-content {
                filter: grayscale(0%) brightness(1.1);
                transform: scale(1.08);
            }

            .nav-card:hover h2 {
                transform: translateY(0);
                color: var(--card-color);
            }

            .nav-card:hover p {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === МОБИЛЬНЫЕ / СЕНСОРНЫЕ УСТРОЙСТВА === */
        /* На тач-экранах ховера нет, поэтому текст и цвет видны сразу — карточку не нужно "открывать" */
        @media (hover: none), (pointer: coarse) {
            .nav-card .media-content {
                filter: grayscale(20%) brightness(0.85);
            }

            .nav-card h2 {
                transform: translateY(0);
                color: var(--card-color);
            }

            .nav-card p {
                opacity: 1;
                transform: translateY(0);
                color: #e2e2e2;
            }

            .nav-card:active {
                transform: scale(0.97);
            }
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 768px) {
            body {
                padding: 40px 16px 60px;
            }

            .cards-container {
                grid-template-columns: 1fr;
                max-width: 420px;
                gap: 22px;
            }

            .nav-card {
                aspect-ratio: 16 / 10;
            }

            h1, .section-divider span {
                font-size: 1.5rem;
            }

            .section-divider {
                margin: 50px auto 30px;
                gap: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-grid"></div>
    <div class="bg-stars" id="bgStars"></div>

    <h1>Навигация</h1>

    <div class="section-divider"><span>1 раздел</span></div>

    <div class="cards-container">

        <a href="#1" class="nav-card" style="--card-color: #0f5e70;">

            <img class="media-content" src="template/Silly2.jpg" alt="PNG Картинка">
            <div class="overlay">
                <h2>###</h2>

    <div class="section-divider"><span>Archived раздел</span></div>

    </div>

    <script>
        // Генерируем звёздочки "*" в случайных местах фона, с разным размером/скоростью мерцания
        (function generateStars() {
            const container = document.getElementById('bgStars');
            const count = window.innerWidth < 768 ? 35 : 70;

            for (let i = 0; i < count; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                star.textContent = '*';

                const size = 10 + Math.random() * 22; // px
                const duration = 3 + Math.random() * 5; // сек
                const delay = Math.random() * 8; // сек

                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.fontSize = size + 'px';
                star.style.animationDuration = duration + 's';
                star.style.animationDelay = delay + 's';
                star.style.opacity = '0';

                container.appendChild(star);
            }
        })();

        // На тач-устройствах видео проигрывается один раз при появлении во вьюпорте,
        // на десктопе — по наведению мыши, как и раньше
        const isTouch = window.matchMedia('(hover: none), (pointer: coarse)').matches;

        document.querySelectorAll('.nav-card').forEach(card => {
            const media = card.querySelector('.media-content');
            if (!media) return;

            if (media.tagName.toLowerCase() === 'video') {
                if (isTouch) {
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                media.play().catch(() => {});
                            } else {
                                media.pause();
                            }
                        });
                    }, { threshold: 0.5 });
                    observer.observe(media);
                } else {
                    card.addEventListener('mouseenter', () => {
                        media.play().catch(error => {
                            console.log('Автоплей заблокирован браузером (нужен interaction):', error);
                        });
                    });
                    card.addEventListener('mouseleave', () => {
                        media.pause();
                        media.currentTime = 0;
                    });
                }
            }
        });
    </script>

</body>
</html>
